name: Build macOS DMG

on:
  push:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Python dependencies
        run: |
          brew install python@3.11
          pip install -r requirements.txt
        working-directory: ./python

      - name: Install frontend dependencies
        run: |
          npm install
        working-directory: ./src

      - name: Install Tauri CLI
        run: |
          npm install -D @tauri-apps/cli@^2
        working-directory: .

      - name: Build Tauri app
        run: |
          npx tauri build
        working-directory: .
        env:
          GITHUB_OUTPUT: ""
          RUST_BACKTRACE: "1"

      - name: Debug build output
        run: |
          echo "=== Checking bundle output ==="
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle dir"
          find src-tauri/target -name "*.dmg" -o -name "*.app" 2>/dev/null | head -5

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 5

      - name: Upload App bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-app
          path: src-tauri/target/release/bundle/macos/*.app
          retention-days: 5

      - name: Upload Python package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-python
          path: python/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && needs.build.result == 'success'

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Simultra-dmg
          path: .

      - name: Download App
        uses: actions/download-artifact@v4
        with:
          name: Simultra-app
          path: ./app

      - name: Download Python
        uses: actions/download-artifact@v4
        with:
          name: Simultra-python
          path: ./python

      - name: List files
        run: |
          ls -la
          find . -name "*.dmg" -o -name "*.app" | head -10

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.dmg
            app/*.app
            python/
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}