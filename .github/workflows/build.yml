name: Build macOS DMG

on:
  push:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Python
        run: |
          brew install python@3.11
          pip3.11 --version

      - name: Install Python dependencies
        run: |
          pip3.11 install jieba funasr -q
          pip3.11 install -r requirements.txt --no-deps --quiet || true
        working-directory: ./python

      - name: Install frontend dependencies
        run: |
          npm install --silent
          npm run build
        working-directory: ./src

      - name: Install Tauri CLI
        run: |
          npm install -D @tauri-apps/cli@^2 --silent
        working-directory: .

      - name: Build Tauri app bundle
        run: |
          npx tauri build --bundles app
        working-directory: .
        env:
          GITHUB_OUTPUT: ""
          RUST_BACKTRACE: "1"

      - name: Find app bundle
        id: find-app
        run: |
          APP_PATH=$(find src-tauri/target/release -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create DMG with hdiutil
        run: |
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          echo "Creating DMG for: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No app bundle found"
            exit 1
          fi

          # Create a temporary directory for DMG contents
          TEMP_DIR=$(mktemp -d)
          DMG_NAME="Simultra"

          # Copy app to temp directory with a proper name
          cp -R "$APP_PATH" "$TEMP_DIR/$DMG_NAME.app"

          # Create the DMG using hdiutil
          hdiutil create \
            -volname "$DMG_NAME" \
            -srcfolder "$TEMP_DIR" \
            -ov \
            -format UDZO \
            -compression-type zlib \
            src-tauri/target/release/Simultra.dmg

          # Clean up
          rm -rf "$TEMP_DIR"

          ls -la src-tauri/target/release/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-dmg
          path: src-tauri/target/release/Simultra.dmg
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Simultra-dmg
          path: .

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.dmg
          tag_name: v0.1.3
          name: Simultra v0.1.3
          body: |
            ## Simultra v0.1.3

            AI 同声传译软件 - 完整安装包

            ### 系统要求
            - macOS 12.0+
            - Ollama（需单独安装）

            ### 安装步骤
            1. 双击 DMG 安装
            2. 在 Mac 上安装 Ollama: `brew install ollama`
            3. 下载模型: `ollama pull llama3.2:3b`
            4. 运行 Simultra 应用
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}