name: Build macOS DMG

on:
  push:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Python dependencies
        run: |
          brew install python@3.11
          cd python
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd src
          npm install

      - name: Build Tauri app
        run: |
          cd ..
          npm install -D @tauri-apps/cli@^2
          npx tauri build --verbose

      - name: Prepare Release
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/dmg/*.dmg release/ 2>/dev/null || true
          cp -r src-tauri/target/release/bundle/macos/*.app release/ 2>/dev/null || true
          cp -r python release/ 2>/dev/null || true
          cp README.md release/
          cp python/requirements.txt release/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-dmg
          path: release/*.dmg
          retention-days: 5

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-app
          path: release/*.app
          retention-days: 5

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-python
          path: release/python/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.dmg
            Simultra-app/*.app
            Simultra-python/
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}