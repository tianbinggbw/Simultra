name: Build macOS DMG

on:
  push:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Python
        run: |
          brew install python@3.11
          pip3.11 --version

      - name: Install Python dependencies
        run: |
          pip3.11 install jieba
          pip3.11 install funasr
          pip3.11 install -r requirements.txt --no-deps
        working-directory: ./python

      - name: Install frontend dependencies
        run: |
          npm install
          npm run build
        working-directory: ./src

      - name: Install Tauri CLI
        run: |
          npm install -D @tauri-apps/cli@^2
        working-directory: .

      - name: Build Tauri app
        run: |
          npx tauri build
        working-directory: .
        env:
          GITHUB_OUTPUT: ""
          RUST_BACKTRACE: "1"

      - name: Debug build output
        run: |
          echo "=== Checking release bundle output ==="
          find src-tauri/target/release -name "*.app" -type d 2>/dev/null
          find src-tauri/target/release -name "*.dmg" -type f 2>/dev/null
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle dir"

      - name: Copy Python backend to App bundle
        run: |
          echo "=== Finding app bundle ==="
          # Try different locations
          APP_BUNDLE=$(find src-tauri/target/release -name "*.app" -type d 2>/dev/null | head -1)
          echo "Found: $APP_BUNDLE"

          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: No app bundle found"
            ls -la src-tauri/target/release/ 2>/dev/null || echo "No release dir"
            exit 1
          fi

          RESOURCES_DIR="$APP_BUNDLE/Contents/Resources"
          mkdir -p "$RESOURCES_DIR"
          cp -r python "$RESOURCES_DIR/"
          cp start.sh "$RESOURCES_DIR/"
          cp stop.sh "$RESOURCES_DIR/"
          cp python/requirements.txt "$RESOURCES_DIR/"
          echo "=== Python backend copied ==="
          ls -la "$RESOURCES_DIR/"

      - name: Create DMG
        run: |
          APP_BUNDLE=$(find src-tauri/target/release -name "*.app" -type d 2>/dev/null | head -1)
          DMG_DIR=src-tauri/target/release/bundle/dmg
          mkdir -p "$DMG_DIR"

          if [ -d "$APP_BUNDLE" ]; then
            DMG_PATH="$DMG_DIR/Simultra-0.1.2.dmg"
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_BUNDLE" "$TEMP_DIR/Simultra.app"
            ln -s /Applications "$TEMP_DIR/Applications"
            hdiutil create -srcfolder "$TEMP_DIR" -volname "Simultra" -fs HFS+ "$DMG_PATH" -format UDZO
            rm -rf "$TEMP_DIR"
            echo "=== DMG created ==="
            ls -la "$DMG_DIR/"
          else
            echo "ERROR: App bundle not found"
            exit 1
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simultra-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Simultra-dmg
          path: .

      - name: List files
        run: |
          ls -la
          find . -name "*.dmg" | head -5

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.dmg
          tag_name: v0.1.2
          name: Simultra v0.1.2
          body: |
            ## Simultra v0.1.2

            AI 同声传译软件 - 完整安装包

            ### 包含内容
            - Simultra 桌面应用（UI）
            - Python 后端（内置，无需单独下载）

            ### 系统要求
            - macOS 12.0+
            - Ollama（需单独安装）

            ### 安装步骤
            1. 双击 DMG 安装
            2. 在 Mac 上安装 Ollama: `brew install ollama`
            3. 下载模型: `ollama pull llama3.2:3b`
            4. 运行 Simultra 应用
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}