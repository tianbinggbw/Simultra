name: Build macOS DMG

on:
  push:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Python
        run: |
          brew install python@3.11
          pip3.11 --version

      - name: Install Python dependencies
        run: |
          pip3.11 install jieba funasr -q
          pip3.11 install -r requirements.txt --no-deps --quiet || true
        working-directory: ./python

      - name: Install frontend dependencies
        run: |
          npm install --silent
          npm run build
        working-directory: ./src

      - name: Install Tauri CLI
        run: |
          npm install -D @tauri-apps/cli@^2 --silent
        working-directory: .

      - name: Generate icons from SVG
        run: |
          npx tauri icon src-tauri/icons/icon.svg
        working-directory: .

      - name: Build Tauri app bundle and DMG
        run: |
          npx tauri build --bundles app,dmg
        working-directory: .
        env:
          RUST_BACKTRACE: "1"

      - name: Debug DMG location
        run: |
          ls -la src-tauri/target/release/bundle/dmg/ || echo "Directory not found"
          find src-tauri/target/release -name "*.dmg" -type f 2>/dev/null || echo "No DMG found"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Simultra-dmg
          path: src-tauri/target/release/bundle/dmg/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Simultra-dmg
          path: .

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Simultra-dmg/*.dmg
          tag_name: v0.1.4
          name: Simultra v0.1.4
          body: |
            ## Simultra v0.1.4

            AI 同声传译软件 - 完整安装包

            ### 系统要求
            - macOS 12.0+
            - Ollama（需单独安装）

            ### 安装步骤
            1. 双击 DMG 安装
            2. 在 Mac 上安装 Ollama: `brew install ollama`
            3. 下载模型: `ollama pull llama3.2:3b`
            4. 运行 Simultra 应用
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}